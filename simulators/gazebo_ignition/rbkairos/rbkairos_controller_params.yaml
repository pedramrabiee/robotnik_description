/**:
  controller_manager:
    ros__parameters:
      use_sim_time: true
      update_rate: 50
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      # robotnik_base_control disabled - using VelocityControl plugin instead
      # robotnik_base_control:
      #   type: robotnik_controllers/RBKairosController
      forward_velocity_controller:
        type: forward_command_controller/ForwardCommandController
      gripper_controller:
        type: position_controllers/GripperActionController

  gripper_controller:
    ros__parameters:
      joint: rbkairos_gripper_robotiq_85_left_knuckle_joint
      goal_tolerance: 0.1
      max_effort: 235.0
      allow_stalling: true
      stall_velocity_threshold: 0.05
      stall_timeout: 0.5
